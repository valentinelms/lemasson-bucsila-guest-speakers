      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

round: #F6F1E7\">LaunchLab · From Idea to Live Website<\u002Fspan>\n<span style=\"padding: 8px 14px; border-radius: 999px; background: #F6F1E7\">Oct 2026 · 2 × 1h<\u002Fspan>\n<\u002Fdiv>\n<h2 class=\"serif\" style=\"font-size: clamp(44px, 7vw, 112px); line-height: .95; letter-spacing: -0.035em; font-weight: 400; margin: 32px 0 0; max-width: 1100px\">Three high schoolers taught a room of master's students <em style=\"font-weight: 300\">how to ship a website.<\u002Fem><\u002Fh2>\n<p style=\"font-size: 20px; line-height: 1.5; margin: 28px 0 0; max-width: 620px\">From a blank prompt to a live link, without writing code by hand.<\u002Fp>\n<p style=\"font-size: 14px; margin: 18px 0 0; color: #2E3E2E\">Two one-hour guest sessions on vibe coding for 100+ master's students, invited by Professor Madina Kalyayeva.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- story moment -->\n<div style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1000px; margin: 0 auto; text-align: center\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #B0655E\">How this session happened<\u002Fdiv>\n<p class=\"serif\" aria-label=\"{{storyText}}\" style=\"font-size: clamp(28px, 3.6vw, 48px); line-height: 1.25; letter-spacing: -0.015em; margin: 24px 0 0\">\n<sc-for list=\"{{storyWords}}\" as=\"w\" hint-placeholder-count=\"40\"><span aria-hidden=\"true\" class=\"word\" style=\"{{w.st}}\">{{w.t}}&nbsp;<\u002Fspan><\u002Fsc-for>\n<\u002Fp>\n<div style=\"display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 14px 22px; border-radius: 999px; background: #F3D3CF; font-weight: 700\">\n<span style=\"width: 10px; height: 10px; border-radius: 50%; background: #14213D\"><\u002Fspan>\nLesson: take the opportunity when it shows up.\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- speakers -->\n<div style=\"padding: 40px 24px 120px\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; jus le=\"flex: 1\">{{st.t}}<\u002Fspan>\n<span style=\"font-size: 11px; opacity: .6\">{{st.tool}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n\n<!-- stage panel -->\n<div style=\"flex: 1 1 auto; min-width: 0; border-radius: 32px; background: #F6F1E7; color: #14213D; padding: clamp(24px, 4vw, 48px); min-height: 560px; display: flex; flex-direction: column\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"padding: 6px 12px; border-radius: 999px; background: {{partBg}}; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase\">{{cur.part}}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; color: #3B4A6B\">Stage {{cur.n}} / 08<\u002Fspan>\n<\u002Fdiv>\n<h4 class=\"serif\" style=\"font-size: clamp(32px, 4vw, 56px); line-height: 1; letter-spacing: -0.025em; font-weight: 400; margin: 24px 0 0\">{{cur.t}} <em style=\"font-weight: 300; color: #6F8A6B\">· {{cur.tool}}<\u002Fem><\u002Fh4>\n<div style=\"flex: 1; margin-top: 24px\">\n\n<sc-if value=\"{{s0}}\" hint-placeholder-val=\"{{true}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">Build the visual shell of your site by describing it. No code.<\u002Fp>\n<div style=\"margin-top: 24px; border-radius: 24px; background: #fff; padding: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<div class=\"serif\" style=\"font-size: 24px\">The art of prompting<\u002Fdiv>\n<div role=\"group\" aria-label=\"Prompt quality\" style=\"display: flex; padding: 4px; border-radius: 999px; background: #F6F1E7\">\n<button sc-camel-on-click=\"{{showBad}}\" aria-pressed=\"{{badPressed}}\" style=\"min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 0; font: 700 13px 'Manrope', sans-serif; cursor: pointer; {{badTabStyle}}\">Bad prompt<\u002Fbutton>\n<button sc-camel-on-click=\"{{showGood}}\" aria-pressed=\"{{goodPressed}}\" style=\"min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 0; font: 700 13px 'Manrope', sans-serif; cursor: pointer; {{goodTabStyle}}\">Good prompt<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{badShown}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"margin-top: 18px; padding: 20px; border-radius: 16px; background: #FBE9E6; font-family: ui-monospace, Menlo, monospace; font-size: 15px\">Create a website for my course<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 20px; font-style: italic; margin: 16px 0 0\">\"Not sure if bad model... or bad prompt.\"<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{goodPrompt}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px\">\n<sc-for list=\"{{goodParts}}\" as=\"g\" hint-placeholder-count=\"7\">\n<div style=\"padding: 14px; border-radius: 14px; background: #EEF3E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #4F6B4B\">{{g.k}}<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.45\">{{g.v}}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s1}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">When the design is done, open the Share menu and click <strong>Handoff to Claude Code<\u002Fstrong>.<\u002Fp>\n<div style=\"margin-top: 28px; max-width: 420px; border-radius: 20px; background: #fff; box-shadow: 0 20px 40px rgba(20,33,61,.1); padding: 10px\">\n<div style=\"padding: 10px 14px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #3B4A6B\">Share<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px\">Copy link<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px\">Export<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 700; background: {{accent}}; display: flex; justify-content: space-between\">Handoff to Claude Code <span>→<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; display: inline-flex; gap: 10px; align-items: center; padding: 12px 18px; border-radius: 14px; background: #F3D3CF; font-size: 14px; font-weight: 600\">Tip: find this button before you start. It's easy to miss.<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s2}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">An agentic coding tool that reads your whole project, runs commands and fixes its own errors. Tap a card to flip it.<\u002Fp>\n<div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px\">\n<sc-for list=\"{{flips}}\" as=\"f\" hint-placeholder-count=\"3\">\n<button class=\"flip {{f.cls}}\" sc-camel-on-click=\"{{f.go}}\" aria-pressed=\"{{f.on}}\" style=\"height: 180px; border: 0; padding: 0; background: transparent; font: inherit; color: inherit; text-align: left\">\n<div class=\"in\">\n<div class=\"face\" style=\"background: #14213D; color: #F6F1E7\"><span style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; opacity: .7\">TAP TO FLIP<\u002Fspan><span class=\"serif\" style=\"font-size: 28px\">{{f.t}}<\u002Fspan><\u002Fdiv>\n<div class=\"face back\" style=\"background: {{accent}}; color: #14213D\"><span style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em\">{{f.t}}<\u002Fspan><span style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">{{f.d}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div class=\"lift\" style=\"padding: 16px; border-radius: 18px; background: #fff\"><div style=\"font-weight: 800\">Snapiq<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">Screenshot Chrome extension for students · snapiq.tools<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 16px; border-radius: 18px; background: #fff\"><div style=\"font-weight: 800\">Doq<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">Competition finder for high schoolers · doq.world<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; border: 1.5px dashed rgba(20,33,61,.3)\"><div style=\"font-weight: 800\">Quick deploy<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">localhost, or tiiny.host: zip files with index.html at the top level, then upload<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s3}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">Your project's online home is a <strong>repository<\u002Fstrong>. Store files and their history, share them publicly, collaborate without overwriting each other.<\u002Fp>\n<div class=\"col-m\" style=\"margin-top: 24px; display: flex; gap: 14px; align-items: stretch\">\n<div style=\"flex: 0 0 150px; border-radius: 20px; background: #fff; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px\">\n<div style=\"font-weight: 800\">Your computer<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: #EEF3E7\">↻ Commit (local loop)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0\">\n<div><div style=\"font-size: 12px; font-weight: 800\">Push →<\u002Fdiv><div style=\"position: relative; height: 10px; border-radius: 5px; background: rgba(20,33,61,.1); margin-top: 4px\"><span class=\"dotflow\" style=\"position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #14213D\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 12px; font-weight: 800; text-align: right\">← Clone<\u002Fdiv><div style=\"position: relative; height: 10px; border-radius: 5px; background: rgba(20,33,61,.1); margin-top: 4px\"><span class=\"dotback\" style=\"position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #B0655E\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 0 0 190px; border-radius: 20px; background: #14213D; color: #F6F1E7; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-weight: 800\">GitHub<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(246,241,231,.1)\">Fork: copy a repo<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(246,241,231,.1)\">Pull request → Merge<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 19px; font-style: italic; margin: 18px 0 0\">\"Most Git actions just move your work between these two copies.\"<\u002Fp>\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n<div style=\"padding: 18px; border-radius: 18px; background: #EEF3E7\"><div style=\"font-weight: 800\">Push<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Uploads straight away, no review. Use it solo or on your own branch.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 18px; border-radius: 18px; background: #FBE9E6\"><div style=\"font-weight: 800\">Pull request<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Teammates review, comment and approve first. Use it in a team.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s4}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">GitHub stores your code, but nothing there is a website yet. Vercel reads the repo, builds the site and hosts it at a public link.<\u002Fp>\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px\">\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: #fff\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">1<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Sign in with GitHub<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: #fff\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">2<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Import your repo<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: {{accent}}\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">3<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Click Deploy<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #EEF3E7\">Every push updates the live site automatically.<\u002Fdiv>\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #EEF3E7\">Every pull request gets its own preview link.<\u002Fdiv>\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #FBE9E6\">Claude can connect to GitHub through the GitHub connector and work inside your repositories.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s5}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px\">\n<div class=\"lift\" style=\"padding: 24px; border-radius: 22px; background: #fff\"><div class=\"serif\" style=\"font-size: 30px\">It forgets everyone<\u002Fdiv><p style=\"font-size: 15px; line-height: 1.55; color: #3B4A6B; margin: 10px 0 0\">A Wordle clone has no idea who you were once you close the tab.<\u002Fp><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 24px; border-radius: 22px; background: #fff\"><div class=\"serif\" style=\"font-size: 30px\">It only knows its own files<\u002Fdiv><p style=\"font-size: 15px; line-height: 1.55; color: #3B4A6B; margin: 10px 0 0\">No live data, like today's weather, unless something feeds it in.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s6}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px\">\n<div style=\"padding: 20px; border-radius: 20px; background: #fff\"><div style=\"font-weight: 800\">Sign up<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5; color: #3B4A6B\">Creates a row in a user table: email + scrambled password.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; border-radius: 20px; background: {{accent}}\"><div style=\"font-weight: 800\">Log in<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5\">Checks that table and hands your browser a token, a temporary sticker that says who you are.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; border-radius: 20px; background: #fff\"><div style=\"font-weight: 800\">Log out<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5; color: #3B4A6B\">Throws the token away.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 20px; font-style: italic; margin: 20px 0 0\">No retyping your password on every click. All three are just API calls.<\u002Fp>\n<\u002Fsc-if>\n\n<sc-if value=\"{{s7}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">A backend-as-a-service that adds sign-up, log-in and a database to your site, connects with GitHub and Vercel, and shows usage stats.<\u002Fp>\n<div style=\"margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap\">\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #EEF3E7; font-weight: 700\">Auth<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #EEF3E7; font-weight: 700\">Database<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #FBE9E6; font-weight: 700\">GitHub + Vercel<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #FBE9E6; font-weight: 700\">Usage stats<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<div style=\"margin-top: 28px; display: flex; justify-content: space-between; gap: 12px\">\n<button sc-camel-on-click=\"{{prevStage}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">← Back<\u002Fbutton>\n<button sc-camel-on-click=\"{{nextStage}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 0; background: #14213D; color: #F6F1E7; font: 700 14px 'Manrope', sans-serif\">{{nextLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- file cheat sheet -->\n<div style=\"margin-top: 32px; border-radius: 28px; background: #F3D3CF; color: #14213D; padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: center\">\n<div class=\"serif\" style=\"font-size: 30px; line-height: 1.05\">File cheat sheet<\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">index.html<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The words and structure people read<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">styles.css<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The look: colours, fonts, spacing, phone vs laptop<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">script.js<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The behaviour: what happens on click, typing or submit<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- takeaways -->\n<div style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n<h3 class=\"serif\" style=\"font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 0\">Six things to keep.<\u002Fh3>\n<div style=\"display: flex; gap: 10px\">\n<button sc-camel-on-click=\"{{revealNext}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 0; background: {{accent}}; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Reveal next ({{takeN}}/6)<\u002Fbutton>\n<button sc-camel-on-click=\"{{revealAll}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Show all<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px\">\n<sc-for list=\"{{takeaways}}\" as=\"t\" hint-placeholder-count=\"6\">\n<li class=\"tk {{t.cls}}\" style=\"display: flex; gap: 20px; align-items: baseline; padding: 28px; border-radius: 26px; background: {{t.bg}}\">\n<span class=\"serif\" style=\"font-size: 48px; font-style: italic; line-height: 1\">{{t.n}}<\u002Fspan>\n<span style=\"font-size: 19px; line-height: 1.4; font-weight: 600\">{{t.t}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ GAME ============ -->\n<div id=\"game\" class=\"grain\" style=\"padding: 120px 24px; background: #F3D3CF\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n<div>\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8A4A44\">The game · Session 01<\u002Fdiv>\n<h3 class=\"serif\" style=\"font-size: clamp(44px, 6vw, 96px); line-height: .95; letter-spacing: -0.035em; font-weight: 400; margin: 14px 0 0\">Launch Your Site<\u002Fh3>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\">\n<div style=\"padding: 14px 20px; border-radius: 20px; background: #F6F1E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase\">Score<\u002Fdiv><div class=\"serif\" style=\"font-size: 36px; line-height: 1\">{{score}}<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 14px 20px; border-radius: 20px; background: #14213D; color: #F6F1E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase\">Level<\u002Fdiv><div class=\"serif\" style=\"font-size: 36px; line-height: 1\">{{levelLabel}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"col-m\" style=\"margin-top: 40px; display: flex; gap: 24px; align-items: stretch\">\n<!-- fuel gauge -->\n<div style=\"flex: 0 0 140px; border-radius: 32px; background: #14213D; color: #F6F1E7; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n<div style=\"font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase\">Fuel<\u002Fdiv>\n<div class=\"hide-m\" style=\"position: relative; flex: 1; min-height: 260px; width: 46px; border-radius: 23px; background: rgba(246,241,231,.12); overflow: hidden\">\n<div style=\"position: absolute; left: 0; right: 0; bottom: 0; background: {{accent}}; transition: height .8s cubic-bezier(.2,.8,.2,1); {{fuelStyle}}\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to top, transparent 0 calc(25% - 2px), #14213D calc(25% - 2px) 25%)\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"serif\" style=\"font-size: 32px\">{{fuelPct}}%<\u002Fdiv>\n<div class=\"{{rocketCls}}\" aria-hidden=\"true\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M32 6c8 7 11 17 11 27l-4 7H25l-4-7C21 23 24 13 32 6z\" fill=\"#F3D3CF\" stroke=\"#14213D\"><\u002Fpath><circle cx=\"32\" cy=\"24\" r=\"4\" fill=\"{{accent}}\" stroke=\"#14213D\"><\u002Fcircle><path d=\"M27 42c0 6 2 10 5 13 3-3 5-7 5-13\" fill=\"{{accent}}\" stroke=\"none\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- game panel -->\n<div class=\"{{panelCls}}\" style=\"flex: 1; min-width: 0; position: relative; border-radius: 32px; background: #F6F1E7; padding: clamp(22px, 4vw, 44px); min-height: 560px; display: flex; flex-direction: column\">\n<sc-if value=\"{{fbOk}}\" hint-placeholder-val=\"{{false}}\"><div class=\"burst\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{g0}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: start; gap: 22px\">\n<div class=\"serif\" style=\"font-size: clamp(30px, 3.6vw, 52px); line-height: 1.05; letter-spacing: -0.02em; max-width: 680px\">Four levels. Each one adds a quarter tank. Fill it and your site goes live.<\u002Fdiv>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.9\">\n<li>Fix the prompt<\u002Fli><li>Build the pipeline<\u002Fli><li>Git vocab match<\u002Fli><li>Which file? (10 seconds each)<\u002Fli><li>Bonus: true or false<\u002Fli>\n<\u002Fol>\n<p style=\"font-size: 14px; color: #3B4A6B; margin: 0\">Drag items on desktop, or tap to pick and tap to drop. Works on phones.<\u002Fp>\n<button sc-camel-on-click=\"{{startGame}}\" class=\"btn\" style=\"min-height: 56px; padding: 16px 32px; border-radius: 999px; border: 0; background: #14213D; color: #F6F1E7; font: 800 16px 'Manrope', sans-serif\">Play<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{g1}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 1 · Fix the prompt<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Drag (or tap) the 6 good ingredients into the prompt. Two are traps.<\u002Fp>\n<div sc-camel-on-drag-over=\"{{allowDrop}}\" sc-camel-on-drop=\"{{dropL1}}\" style=\"margin-top: 20px; padding: 22px; border-radius: 22px; background: #fff; border: 2px dashed rgba(20,33,61,.25); min-height: 150px\">\n<div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 16px\">Create a website for my course<\u002Fdiv>\n<div style=\"margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{l1Placed}}\" as=\"p\" hint-placeholder-count=\"0\"><span style=\"padding: 8px 14px; border-radius: 999px; background: #C9D8B6; font-weight: 700; font-size: 14px\">+ {{p}}<\u002Fspan><\u002Fsc-for>\n<sc-if value=\"{{l1Empty}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-size: 14px; color: #6B7280\">Drop ingredients here…<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{l1Chips}}\" as=\"c\" hint-placeholder-count=\"8\">\n<button draggable=\"true\" sc-camel-on-drag-start=\"{{c.drag}}\" sc-camel-on-click=\"{{c.go}}\" disabled=\"{{c.used}}\" class=\"chip {{c.cls}}\" style=\"min-height: 48px; padding: 12px 18px; border-radius: 999px; border: 1.5px solid #14213D; background: #fff; font: 700 15px 'Manrope', sans-serif; color: #14213D\">{{c.t}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{g2}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 2 · Build the pipeline<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Put the five steps in order, from idea to live link.<\u002Fp>\n<div sc-camel-on-drag-over=\"{{allowDrop}}\" sc-camel-on-drop=\"{{dropL2}}\" style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px\">\n<sc-for list=\"{{l2Slots}}\" as=\"sl\" hint-placeholder-count=\"5\">\n<div style=\"min-height: 92px; padding: 14px; border-radius: 18px; {{sl.st}}; display: flex; flex-direction: column; justify-content: space-between\">\n<span style=\"font-size: 11px; font-weight: 800; opacity: .7\">STEP {{sl.n}}<\u002Fspan>\n<span style=\"font-weight: 700; font-size: 15px\">{{sl.t}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{l2Items}}\" as=\"c\" hint-placeholder-count=\"5\">\n<button draggable=\"true\" sc-camel-on-drag-start=\"{{c.drag}}\" sc-camel-on-click=\"{{c.go}}\" disabled=\"{{c.used}}\" class=\"chip {{c.cls}}\" style=\"min-height: 48px; padding: 12px 18px; border-radius: 16px; border: 1.5px solid #14213D; background: #fff; font: 700 15px 'Manrope', sans-serif; color: #14213D\">{{c.t}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{g3}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 3 · Git vocab match<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Drag a term onto its meaning, or tap a term then tap its meaning.<\u002Fp>\n<div class=\"col-m\" style=\"margin-top: 20px; display: flex; gap: 18px; align-items: start\">\n<div style=\"flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{l3Te =\"min-height: 64px; border-radius: 20px; border: 0; background: #fff; font: 800 17px ui-monospace, Menlo, monospace; color: #14213D\">index.html<\u002Fbutton>\n<button sc-camel-on-click=\"{{pickCss}}\" class=\"btn\" style=\"min-height: 64px; border-radius: 20px; border: 0; background: #C9D8B6; font: 800 17px ui-monospace, Menlo, monospace; color: #14213D\">styles.css<\u002Fbutton>\n<button sc-camel-on-click=\"{{pickJs}}\" class=\"btn\" style=\"min-height: 64px; border-radius: 20px; border: 0; background: #14213D; font: 800 17px ui-monospace, Menlo, monospace; color: #F6F1E7\">script.js<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{g5}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Bonus round · True or false · {{tfNum}}/7<\u002Fdiv>\n<button sc-camel-on-click=\"{{doLaunch}}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; font: 700 13px 'Manrope', sans-serif; text-decoration: underline; color: #14213D; cursor: pointer\">Skip to launch<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 0\">\n<div class=\"tilt\" style=\"width: min(480px, 100%); min-height: 240px; border-radius: 28px; background: #fff; box-shadow: 0 24px 50px rgba(20,33,61,.14); padding: 32px; display: flex; flex-direction: column; justify-content: center\">\n<div class=\"serif\" style=\"font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2\">{{tf}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px\">\n<button sc-camel-on-click=\"{{pickFalse}}\" class=\"btn\" style=\"min-height: 60px; border-radius: 20px; border: 0; background: #14213D; color: #F6F1E7; font: 800 17px 'Manrope', sans-serif\">← False<\u002Fbutton>\n<button sc-camel-on-click=\"{{pickTrue}}\" class=\"btn\" style=\"min-height: 60px; border-radius: 20px; border: 0; background: {{accent}}; color: #14213D; font: 800 17px 'Manrope', sans-serif\">True →<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{g6}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px\">\n<sc-if value=\"{{counting}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"serif\" style=\"font-size: 180px; line-height: 1; font-style: italic\">{{count}}<\u002Fdiv>\n<div style=\"font-weight: 800; letter-spacing: .14em; text-transform: uppercase\">Ignition sequence<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{launched}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"burst\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<div class=\"serif\" style=\"font-size: clamp(40px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em\">You're live.<\u002Fdiv>\n<div style=\"width: min(520px, 100%); border-radius: 16px; background: #fff; box-shadow: 0 20px 40px rgba(20,33,61,.12); overflow: hidden; text-align: left\">\n<div style=\"display: flex; gap: 6px; padding: 12px 14px; background: #EDE7DA\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #E9A69C\"><\u002Fspan><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #E8CF8A\"><\u002Fspan><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #A9C59A\"><\u002Fspan><\u002Fdiv>\n<div style=\"padding: 14px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 17px\">https://{{typed}}<span class=\"caret\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 15px\">Final score <strong style=\"font-size: 22px\">{{score}}<\u002Fstrong><\u002Fdiv>\n<sc-if value=\"{{notSaved}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"col-m\" style=\"display: flex; gap: 10px; width: min(520px, 100%)\">\n<label for=\"lbname\" style=\"position: absolute; left: -9999px\">Your name<\u002Flabel>\n<input id=\"lbname\" value=\"{{name}}\" sc-camel-on-change=\"{{setName}}\" placeholder=\"Your name\" maxlength=\"24\" style=\"flex: 1; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #14213D; background: #fff; font: 600 16px 'Manrope', sans-serif; color: #14213D\">\n<button sc-camel-on-click=\"{{save}}\" class=\"btn\" style=\"min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: {{accent}}; font: 800 15px 'Manrope', sans-serif; color: #14213D\">Save to leaderboard<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{saved}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-weight: 700\">Saved. Check the leaderboard below.<\u002Fdiv><\u002Fsc-if>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: center\">\n<button sc-camel-on-click=\"{{replay}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Play again<\u002Fbutton>\n<button disabled=\"\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 0; background: rgba(20,33,61,.12); font: 700 14px 'Manrope', sans-serif; color: rgba(20,33,61,.55); cursor: not-allowed\">Next session · Coming soon<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{clear}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"margin-top: 24px; padding: 20px; border-radius: 22px; background: #14213D; color: #F6F1E7; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap\">\n<div><div style=\"font-weight: 800\">Level cleared. +25% fuel<\u002Fdiv><div style=\"font-size: 13px; opacity: .8; margin-top: 2px\">{{clearNote}}<\u002Fdiv><\u002Fdiv>\n<button sc-camel-on-click=\"{{nextLevel}}\" class=\"btn\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 0; background: {{accent}}; font: 800 15px 'Manrope', sans-serif; color: #14213D\">{{nextLevelLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div aria-live=\"polite\" style=\"margin-top: 16px; min-height: 24px; font-size: 15px; font-weight: 600; {{msgStyle}}\">{{msg}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- result card -->\n<div class=\"col-m\" style=\"margin-top: 24px; border-radius: 28px; background: #14213D; color: #F6F1E7; padding: 28px; display: flex; justify-content: space-between; align-items: center; gap: 20px\">\n<div>\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: {{accent}}\">Session 01 result<\u002Fdiv>\n<div class=\"serif\" style=\"font-size: 32px; margin-top: 6px\">{{resultLine}}<\u002Fdiv>\n<\u002Fdiv>\n<button disabled=\"\" style=\"min-height: 52px; padding: 14px 24px; border-radius: 999px; border: 1px dashed rgba(246,241,231,.4); background: transparent; color: rgba(246,241,231,.7); font: 700 15px 'Manrope', sans-serif; cursor: not-allowed\">Next session · Coming soon<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 5. PROGRESS & LEADERBOARD ============ -->\n<section id=\"leaderboard\" style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #6F8A6B\">Progress &amp; leaderboard<\u002Fdiv>\n<h2 class=\"serif\" style=\"font-size: clamp(40px, 5.5vw, 80px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 16px 0 0\">How far have you flown?<\u002Fh2>\n<div style=\"margin-top: 40px; border-radius: 28px; background: #fff; padding: 28px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700\"><span>Semester progress<\u002Fspan><span>{{semPct}}%<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top: 14px; height: 18px; border-radius: 9px; background: #EDE7DA; overflow: hidden; position: relative\">\n<div style=\"height: 100%; background: linear-gradient(90deg, #C9D8B6, {{accent}}); transition: width .8s; {{semStyle}}\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 12px; font-weight: 700; color: #3B4A6B\"><span>01 LaunchLab<\u002Fspan><span>02 · soon<\u002Fspan><span>03 · soon<\u002Fspan><span>04 · soon<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px\">\n<div style=\"border-radius: 28px; background: #C9D8B6; padding: 28px\">\n<div class=\"serif\" style=\"font-size: 30px\">Badges<\u002Fdiv>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px\">\n<sc-for list=\"{{badges}}\" as=\"b\" hint-placeholder-count=\"5\">\n<div class=\"lift\" style=\"padding: 18px 14px; border-radius: 20px; text-align: center; {{b.st}}\">\n<div style=\"width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{b.disc}}\">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l3 6 6 .9-4.5 4.4 1 6.2L12 16.6 6.5 19.5l1-6.2L3 8.9 9 8z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-weight: 800; font-size: 14px; margin-top: 10px\">{{b.t}}<\u002Fdiv>\n<div style=\"font-size: 12px; margin-top: 4px; opacity: .75\">{{b.d}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius:
