02Fspan>\n<\u002Fdiv>\n<h2 class=\"serif\" style=\"font-size: clamp(44px, 7vw, 112px); line-height: .95; letter-spacing: -0.035em; font-weight: 400; margin: 32px 0 0; max-width: 1100px\">Three high schoolers taught a room of master's students <em style=\"font-weight: 300\">how to ship a website.<\u002Fem><\u002Fh2>\n<p style=\"font-size: 20px; line-height: 1.5; margin: 28px 0 0; max-width: 620px\">From a blank prompt to a live link, without writing code by hand.<\u002Fp>\n<p style=\"font-size: 14px; margin: 18px 0 0; color: #2E3E2E\">Two one-hour guest sessions on vibe coding for 100+ master's students, invited by Professor Madina Kalyayeva.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1000px; margin: 0 auto; text-align: center\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #B0655E\">How this session happened<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: clamp(28px, 3.6vw, 48px); line-height: 1.25; letter-spacing: -0.015em; margin: 24px 0 0\">\n<span aria-hidden=\"true\" class=\"word\">{{w.t}}&nbsp;<\u002Fspan>\n<\u002Fp>\n<div style=\"display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 14px 22px; border-radius: 999px; background: #F3D3CF; font-weight: 700\">\n<span style=\"width: 10px; height: 10px; border-radius: 50%; background: #14213D\"><\u002Fspan>\nLesson: take the opportunity when it shows up.\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"padding: 40px 24px 120px\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n<h3 class=\"serif\" style=\"font-size: clamp(36px, 4.5vw, 64px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 0\">The speakers<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #3B4A6B\">Students at Singapore American School<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px\">\n\n<div class=\"tiltwrap\">\n<article class=\"tilt\" style=\"border-radius: 32px; background: #fff; padding: 18px; display: flex; flex-direction: column; gap: 18px; height: 100%\">\n<div style=\"aspect-ratio: 4 / 3.4; border-radius: 22px; background: ; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center\">\n<div aria-hidden=\"true\" style=\"position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%)\"><\u002Fdiv>\n<img style=\"position: relative; width: 66%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 6px solid #F6F1E7; box-shadow: 0 24px 44px -16px rgba(20,33,61,.45)\">\n<span class=\"serif\" aria-hidden=\"true\" style=\"position: absolute; right: 18px; bottom: 12px; font-size: 40px; font-style: italic; line-height: 1\">{{s.ini}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 0 6px\">\n<h4 class=\"serif\" style=\"font-size: 34px; line-height: 1; letter-spacing: -0.02em; font-weight: 500; margin: 0\">{{s.name}}<\u002Fh4>\n<p style=\"font-size: 14px; line-height: 1.5; color: #3B4A6B; margin: 10px 0 0\">{{s.role}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 0 6px\">\n\n<div style=\"padding: 10px 14px; border-radius: 14px; background: #F6F1E7; font-size: 13px; line-height: 1.45\">{{c}}<\u002Fdiv>\n\n<\u002Fdiv>\n\n<p class=\"serif\" style=\"font-size: 19px; font-style: italic; margin: 0; padding: 0 6px\">{{s.line}}<\u002Fp>\n\n<a target=\"_blank\" rel=\"noopener\" class=\"li btn\" style=\"margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 999px; background: #14213D; color: #F6F1E7; text-decoration: none; font-weight: 700; font-size: 14px\">View LinkedIn\n<svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n<\u002Fa>\n<\u002Farticle>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"summary\" style=\"padding: 120px 24px; background: #14213D; color: #F6F1E7\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #D4FF3A\">Interactive summary<\u002Fdiv>\n<h3 class=\"serif\" style=\"font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 16px 0 0\">Eight stages from prompt to liftoff.<\u002Fh3>\n<p style=\"font-size: 15px; opacity: .75; margin: 14px 0 0\">Tap a stage or use Next. The rocket climbs as you go.<\u002Fp>\n\n<div class=\"col-m\" style=\"margin-top: 48px; display: flex; gap: 32px; align-items: stretch\">\n\n<div style=\"flex: 0 0 340px; display: flex; gap: 16px; min-width: 0\">\n<div class=\"hide-m\" style=\"position: relative; width: 56px; flex-shrink: 0; border-radius: 28px; background: rgba(246,241,231,.08)\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: 24px; bottom: 24px; width: 2px; transform: translateX(-50%); background: repeating-linear-gradient(to bottom, rgba(246,241,231,.4) 0 6px, transparent 6px 12px)\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 50%; bottom: 24px; width: 4px; transform: translateX(-50%); border-radius: 2px; background: #D4FF3A; transition: height .6s cubic-bezier(.2,.8,.2,1); \"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 50%; transform: translate(-50%, 50%); transition: bottom .6s cubic-bezier(.2,.8,.2,1); \">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#14213D\" stroke-width=\"2\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"32\" r=\"30\" fill=\"#D4FF3A\" stroke=\"none\"><\u002Fcircle><path d=\"M32 12c6 5 8 12 8 19l-3 5h-10l-3-5c0-7 2-14 8-19z\" fill=\"#F6F1E7\"><\u002Fpath><circle cx=\"32\" cy=\"25\" r=\"3\"><\u002Fcircle><path d=\"M29 40c0 4 1 7 3 9 2-2 3-5 3-9\" fill=\"#F3D3CF\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 8px; flex: 1; min-width: 0\">\n\n<li>\n<div style=\"font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin: 10px 0 6px 4px\">{{st.part}}<\u002Fdiv>\n<button class=\"stage \" style=\"width: 100%; min-height: 48px; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(246,241,231,.18); background: transparent; color: inherit; font: 600 14px 'Manrope', sans-serif\">\n<span style=\"font-size: 11px; font-weight: 800; opacity: .7\">{{st.n}}<\u002Fspan>\n<span style=\"flex: 1\">{{st.t}}<\u002Fspan>\n<span style=\"font-size: 11px; opacity: .6\">{{st.tool}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n\n<\u002Fol>\n<\u002Fdiv>\n\n\n<div style=\"flex: 1 1 auto; min-width: 0; border-radius: 32px; background: #F6F1E7; color: #14213D; padding: clamp(24px, 4vw, 48px); min-height: 560px; display: flex; flex-direction: column\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"padding: 6px 12px; border-radius: 999px; background: ; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase\">{{cur.part}}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; color: #3B4A6B\">Stage {{cur.n}} / 08<\u002Fspan>\n<\u002Fdiv>\n<h4 class=\"serif\" style=\"font-size: clamp(32px, 4vw, 56px); line-height: 1; letter-spacing: -0.025em; font-weight: 400; margin: 24px 0 0\">{{cur.t}} <em style=\"font-weight: 300; color: #6F8A6B\">· {{cur.tool}}<\u002Fem><\u002Fh4>\n<div style=\"flex: 1; margin-top: 24px\">\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">Build the visual shell of your site by describing it. No code.<\u002Fp>\n<div style=\"margin-top: 24px; border-radius: 24px; background: #fff; padding: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<div class=\"serif\" style=\"font-size: 24px\">The art of prompting<\u002Fdiv>\n<div role=\"group\" aria-label=\"Prompt quality\" style=\"display: flex; padding: 4px; border-radius: 999px; background: #F6F1E7\">\n<button style=\"min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 0; font: 700 13px 'Manrope', sans-serif; cursor: pointer; \">Bad prompt<\u002Fbutton>\n<button style=\"min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 0; font: 700 13px 'Manrope', sans-serif; cursor: pointer; \">Good prompt<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 18px; padding: 20px; border-radius: 16px; background: #FBE9E6; font-family: ui-monospace, Menlo, monospace; font-size: 15px\">Create a website for my course<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 20px; font-style: italic; margin: 16px 0 0\">\"Not sure if bad model... or bad prompt.\"<\u002Fp>\n\n\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px\">\n\n<div style=\"padding: 14px; border-radius: 14px; background: #EEF3E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #4F6B4B\">{{g.k}}<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.45\">{{g.v}}<\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">When the design is done, open the Share menu and click <strong>Handoff to Claude Code<\u002Fstrong>.<\u002Fp>\n<div style=\"margin-top: 28px; max-width: 420px; border-radius: 20px; background: #fff; box-shadow: 0 20px 40px rgba(20,33,61,.1); padding: 10px\">\n<div style=\"padding: 10px 14px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #3B4A6B\">Share<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px\">Copy link<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px\">Export<\u002Fdiv>\n<div style=\"padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 700; background: #D4FF3A; display: flex; justify-content: space-between\">Handoff to Claude Code <span>→<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; display: inline-flex; gap: 10px; align-items: center; padding: 12px 18px; border-radius: 14px; background: #F3D3CF; font-size: 14px; font-weight: 600\">Tip: find this button before you start. It's easy to miss.<\u002Fdiv>\n\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">An agentic coding tool that reads your whole project, runs commands and fixes its own errors. Tap a card to flip it.<\u002Fp>\n<div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px\">\n\n<button class=\"flip \" style=\"height: 180px; border: 0; padding: 0; background: transparent; font: inherit; color: inherit; text-align: left\">\n<div class=\"in\">\n<div class=\"face\" style=\"background: #14213D; color: #F6F1E7\"><span style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; opacity: .7\">TAP TO FLIP<\u002Fspan><span class=\"serif\" style=\"font-size: 28px\">{{f.t}}<\u002Fspan><\u002Fdiv>\n<div class=\"face back\" style=\"background: #D4FF3A; color: #14213D\"><span style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em\">{{f.t}}<\u002Fspan><span style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">{{f.d}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbutton>\n\n<\u002Fdiv>\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div class=\"lift\" style=\"padding: 16px; border-radius: 18px; background: #fff\"><div style=\"font-weight: 800\">Snapiq<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">Screenshot Chrome extension for students · snapiq.tools<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 16px; border-radius: 18px; background: #fff\"><div style=\"font-weight: 800\">Doq<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">Competition finder for high schoolers · doq.world<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; border: 1.5px dashed rgba(20,33,61,.3)\"><div style=\"font-weight: 800\">Quick deploy<\u002Fdiv><div style=\"font-size: 13px; color: #3B4A6B; margin-top: 4px\">localhost, or tiiny.host: zip files with index.html at the top level, then upload<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">Your project's online home is a <strong>repository<\u002Fstrong>. Store files and their history, share them publicly, collaborate without overwriting each other.<\u002Fp>\n<div class=\"col-m\" style=\"margin-top: 24px; display: flex; gap: 14px; align-items: stretch\">\n<div style=\"flex: 0 0 150px; border-radius: 20px; background: #fff; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px\">\n<div style=\"font-weight: 800\">Your computer<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: #EEF3E7\">↻ Commit (local loop)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0\">\n<div><div style=\"font-size: 12px; font-weight: 800\">Push →<\u002Fdiv><div style=\"position: relative; height: 10px; border-radius: 5px; background: rgba(20,33,61,.1); margin-top: 4px\"><span class=\"dotflow\" style=\"position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #14213D\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 12px; font-weight: 800; text-align: right\">← Clone<\u002Fdiv><div style=\"position: relative; height: 10px; border-radius: 5px; background: rgba(20,33,61,.1); margin-top: 4px\"><span class=\"dotback\" style=\"position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #B0655E\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 0 0 190px; border-radius: 20px; background: #14213D; color: #F6F1E7; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-weight: 800\">GitHub<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(246,241,231,.1)\">Fork: copy a repo<\u002Fdiv>\n<div style=\"font-size: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(246,241,231,.1)\">Pull request → Merge<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 19px; font-style: italic; margin: 18px 0 0\">\"Most Git actions just move your work between these two copies.\"<\u002Fp>\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n<div style=\"padding: 18px; border-radius: 18px; background: #EEF3E7\"><div style=\"font-weight: 800\">Push<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Uploads straight away, no review. Use it solo or on your own branch.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 18px; border-radius: 18px; background: #FBE9E6\"><div style=\"font-weight: 800\">Pull request<\u002Fdiv><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Teammates review, comment and approve first. Use it in a team.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">GitHub stores your code, but nothing there is a website yet. Vercel reads the repo, builds the site and hosts it at a public link.<\u002Fp>\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px\">\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: #fff\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">1<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Sign in with GitHub<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: #fff\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">2<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Import your repo<\u002Fdiv><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 20px; border-radius: 20px; background: #D4FF3A\"><div class=\"serif\" style=\"font-size: 40px; font-style: italic\">3<\u002Fdiv><div style=\"font-weight: 700; margin-top: 8px\">Click Deploy<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #EEF3E7\">Every push updates the live site automatically.<\u002Fdiv>\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #EEF3E7\">Every pull request gets its own preview link.<\u002Fdiv>\n<div style=\"padding: 14px 18px; border-radius: 14px; background: #FBE9E6\">Claude can connect to GitHub through the GitHub connector and work inside your repositories.<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px\">\n<div class=\"lift\" style=\"padding: 24px; border-radius: 22px; background: #fff\"><div class=\"serif\" style=\"font-size: 30px\">It forgets everyone<\u002Fdiv><p style=\"font-size: 15px; line-height: 1.55; color: #3B4A6B; margin: 10px 0 0\">A Wordle clone has no idea who you were once you close the tab.<\u002Fp><\u002Fdiv>\n<div class=\"lift\" style=\"padding: 24px; border-radius: 22px; background: #fff\"><div class=\"serif\" style=\"font-size: 30px\">It only knows its own files<\u002Fdiv><p style=\"font-size: 15px; line-height: 1.55; color: #3B4A6B; margin: 10px 0 0\">No live data, like today's weather, unless something feeds it in.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px\">\n<div style=\"padding: 20px; border-radius: 20px; background: #fff\"><div style=\"font-weight: 800\">Sign up<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5; color: #3B4A6B\">Creates a row in a user table: email + scrambled password.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; border-radius: 20px; background: #D4FF3A\"><div style=\"font-weight: 800\">Log in<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5\">Checks that table and hands your browser a token, a temporary sticker that says who you are.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 20px; border-radius: 20px; background: #fff\"><div style=\"font-weight: 800\">Log out<\u002Fdiv><div style=\"font-size: 14px; margin-top: 8px; line-height: 1.5; color: #3B4A6B\">Throws the token away.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"serif\" style=\"font-size: 20px; font-style: italic; margin: 20px 0 0\">No retyping your password on every click. All three are just API calls.<\u002Fp>\n\n\n\n<p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 640px\">A backend-as-a-service that adds sign-up, log-in and a database to your site, connects with GitHub and Vercel, and shows usage stats.<\u002Fp>\n<div style=\"margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap\">\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #EEF3E7; font-weight: 700\">Auth<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #EEF3E7; font-weight: 700\">Database<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #FBE9E6; font-weight: 700\">GitHub + Vercel<\u002Fspan>\n<span style=\"padding: 12px 18px; border-radius: 999px; background: #FBE9E6; font-weight: 700\">Usage stats<\u002Fspan>\n<\u002Fdiv>\n\n\n<\u002Fdiv>\n<div style=\"margin-top: 28px; display: flex; justify-content: space-between; gap: 12px\">\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">← Back<\u002Fbutton>\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 0; background: #14213D; color: #F6F1E7; font: 700 14px 'Manrope', sans-serif\">{{nextLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"margin-top: 32px; border-radius: 28px; background: #F3D3CF; color: #14213D; padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: center\">\n<div class=\"serif\" style=\"font-size: 30px; line-height: 1.05\">File cheat sheet<\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">index.html<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The words and structure people read<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">styles.css<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The look: colours, fonts, spacing, phone vs laptop<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 16px; border-radius: 18px; background: #F6F1E7\"><code style=\"font-weight: 800\">script.js<\u002Fcode><div style=\"font-size: 13px; margin-top: 6px\">The behaviour: what happens on click, typing or submit<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n<h3 class=\"serif\" style=\"font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 0\">Six things to keep.<\u002Fh3>\n<div style=\"display: flex; gap: 10px\">\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 0; background: #D4FF3A; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Reveal next ({{takeN}}/6)<\u002Fbutton>\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Show all<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px\">\n\n<li class=\"tk \" style=\"display: flex; gap: 20px; align-items: baseline; padding: 28px; border-radius: 26px; background: \">\n<span class=\"serif\" style=\"font-size: 48px; font-style: italic; line-height: 1\">{{t.n}}<\u002Fspan>\n<span style=\"font-size: 19px; line-height: 1.4; font-weight: 600\">{{t.t}}<\u002Fspan>\n<\u002Fli>\n\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"game\" class=\"grain\" style=\"padding: 120px 24px; background: #F3D3CF\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n<div>\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8A4A44\">The game · Session 01<\u002Fdiv>\n<h3 class=\"serif\" style=\"font-size: clamp(44px, 6vw, 96px); line-height: .95; letter-spacing: -0.035em; font-weight: 400; margin: 14px 0 0\">Launch Your Site<\u002Fh3>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\">\n<div style=\"padding: 14px 20px; border-radius: 20px; background: #F6F1E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase\">Score<\u002Fdiv><div class=\"serif\" style=\"font-size: 36px; line-height: 1\">{{score}}<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 14px 20px; border-radius: 20px; background: #14213D; color: #F6F1E7\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase\">Level<\u002Fdiv><div class=\"serif\" style=\"font-size: 36px; line-height: 1\">{{levelLabel}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"col-m\" style=\"margin-top: 40px; display: flex; gap: 24px; align-items: stretch\">\n\n<div style=\"flex: 0 0 140px; border-radius: 32px; background: #14213D; color: #F6F1E7; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n<div style=\"font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase\">Fuel<\u002Fdiv>\n<div class=\"hide-m\" style=\"position: relative; flex: 1; min-height: 260px; width: 46px; border-radius: 23px; background: rgba(246,241,231,.12); overflow: hidden\">\n<div style=\"position: absolute; left: 0; right: 0; bottom: 0; background: #D4FF3A; transition: height .8s cubic-bezier(.2,.8,.2,1); \"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to top, transparent 0 calc(25% - 2px), #14213D calc(25% - 2px) 25%)\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"serif\" style=\"font-size: 32px\">{{fuelPct}}%<\u002Fdiv>\n<div aria-hidden=\"true\">\n<svg width=\"56\" height=\"56\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M32 6c8 7 11 17 11 27l-4 7H25l-4-7C21 23 24 13 32 6z\" fill=\"#F3D3CF\" stroke=\"#14213D\"><\u002Fpath><circle cx=\"32\" cy=\"24\" r=\"4\" fill=\"#D4FF3A\" stroke=\"#14213D\"><\u002Fcircle><path d=\"M27 42c0 6 2 10 5 13 3-3 5-7 5-13\" fill=\"#D4FF3A\" stroke=\"none\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"flex: 1; min-width: 0; position: relative; border-radius: 32px; background: #F6F1E7; padding: clamp(22px, 4vw, 44px); min-height: 560px; display: flex; flex-direction: column\">\n<div class=\"burst\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n\n\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: start; gap: 22px\">\n<div class=\"serif\" style=\"font-size: clamp(30px, 3.6vw, 52px); line-height: 1.05; letter-spacing: -0.02em; max-width: 680px\">Four levels. Each one adds a quarter tank. Fill it and your site goes live.<\u002Fdiv>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.9\">\n<li>Fix the prompt<\u002Fli><li>Build the pipeline<\u002Fli><li>Git vocab match<\u002Fli><li>Which file? (10 seconds each)<\u002Fli><li>Bonus: true or false<\u002Fli>\n<\u002Fol>\n<p style=\"font-size: 14px; color: #3B4A6B; margin: 0\">Drag items on desktop, or tap to pick and tap to drop. Works on phones.<\u002Fp>\n<button class=\"btn\" style=\"min-height: 56px; padding: 16px 32px; border-radius: 999px; border: 0; background: #14213D; color: #F6F1E7; font: 800 16px 'Manrope', sans-serif\">Play<\u002Fbutton>\n<\u002Fdiv>\n\n\n\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 1 · Fix the prompt<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Drag (or tap) the 6 good ingredients into the prompt. Two are traps.<\u002Fp>\n<div style=\"margin-top: 20px; padding: 22px; border-radius: 22px; background: #fff; border: 2px dashed rgba(20,33,61,.25); min-height: 150px\">\n<div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 16px\">Create a website for my course<\u002Fdiv>\n<div style=\"margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"padding: 8px 14px; border-radius: 999px; background: #C9D8B6; font-weight: 700; font-size: 14px\">+ {{p}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #6B7280\">Drop ingredients here…<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px\">\n\n<button draggable=\"true\" class=\"chip \" style=\"min-height: 48px; padding: 12px 18px; border-radius: 999px; border: 1.5px solid #14213D; background: #fff; font: 700 15px 'Manrope', sans-serif; color: #14213D\">{{c.t}}<\u002Fbutton>\n\n<\u002Fdiv>\n\n\n\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 2 · Build the pipeline<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Put the five steps in order, from idea to live link.<\u002Fp>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px\">\n\n<div style=\"min-height: 92px; padding: 14px; border-radius: 18px; ; display: flex; flex-direction: column; justify-content: space-between\">\n<span style=\"font-size: 11px; font-weight: 800; opacity: .7\">STEP {{sl.n}}<\u002Fspan>\n<span style=\"font-weight: 700; font-size: 15px\">{{sl.t}}<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px\">\n\n<button draggable=\"true\" class=\"chip \" style=\"min-height: 48px; padding: 12px 18px; border-radius: 16px; border: 1.5px solid #14213D; background: #fff; font: 700 15px 'Manrope', sans-serif; color: #14213D\">{{c.t}}<\u002Fbutton>\n\n<\u002Fdiv>\n\n\n\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 3 · Git vocab match<\u002Fdiv>\n<p style=\"font-size: 17px; margin: 10px 0 0\">Drag a term onto its meaning, or tap a term then tap its meaning.<\u002Fp>\n<div class=\"col-m\" style=\"margin-top: 20px; display: flex; gap: 18px; align-items: start\">\n<div style=\"flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px\">\n\n<button draggable=\"true\" class=\"chip \" style=\"min-height: 48px; padding: 10px 16px; border-radius: 14px; border: 1.5px solid #14213D; background: #fff; font: 800 15px 'Manrope', sans-serif; color: #14213D; text-align: left\">{{c.t}}<\u002Fbutton>\n\n<\u002Fdiv>\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n\n<button style=\"min-height: 48px; padding: 12px 16px; border-radius: 14px; border: 1.5px dashed rgba(20,33,61,.3); font: 600 14px 'Manrope', sans-serif; color: #14213D; text-align: left; cursor: pointer; \">{{m.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Level 4 · Which file? · {{q4Num}}/6<\u002Fdiv>\n<div style=\"font-weight: 800; font-size: 14px\">{{l4t}}s<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 10px; height: 8px; border-radius: 4px; background: rgba(20,33,61,.1); overflow: hidden\"><div style=\"height: 100%; background: #14213D; transition: width 1s linear; \"><\u002Fdiv><\u002Fdiv>\n<div class=\"serif\" style=\"font-size: clamp(30px, 3.6vw, 50px); line-height: 1.1; letter-spacing: -0.02em; margin-top: 40px; min-height: 120px\">{{q4}}<\u002Fdiv>\n<div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px\">\n<button class=\"btn\" style=\"min-height: 64px; border-radius: 20px; border: 0; background: #fff; font: 800 17px ui-monospace, Menlo, monospace; color: #14213D\">index.html<\u002Fbutton>\n<button class=\"btn\" style=\"min-height: 64px; border-radius: 20px; border: 0; background: #C9D8B6; font: 800 17px ui-monospace, Menlo, monospace; color: #14213D\">styles.css<\u002Fbutton>\n<button class=\"btn\" style=\"min-height: 64px; border-radius: 20px; border: 0; background: #14213D; font: 800 17px ui-monospace, Menlo, monospace; color: #F6F1E7\">script.js<\u002Fbutton>\n<\u002Fdiv>\n\n\n\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8A4A44\">Bonus round · True or false · {{tfNum}}/7<\u002Fdiv>\n<button style=\"min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; font: 700 13px 'Manrope', sans-serif; text-decoration: underline; color: #14213D; cursor: pointer\">Skip to launch<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 0\">\n<div class=\"tilt\" style=\"width: min(480px, 100%); min-height: 240px; border-radius: 28px; background: #fff; box-shadow: 0 24px 50px rgba(20,33,61,.14); padding: 32px; display: flex; flex-direction: column; justify-content: center\">\n<div class=\"serif\" style=\"font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2\">{{tf}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px\">\n<button class=\"btn\" style=\"min-height: 60px; border-radius: 20px; border: 0; background: #14213D; color: #F6F1E7; font: 800 17px 'Manrope', sans-serif\">← False<\u002Fbutton>\n<button class=\"btn\" style=\"min-height: 60px; border-radius: 20px; border: 0; background: #D4FF3A; color: #14213D; font: 800 17px 'Manrope', sans-serif\">True →<\u002Fbutton>\n<\u002Fdiv>\n\n\n\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px\">\n\n<div class=\"serif\" style=\"font-size: 180px; line-height: 1; font-style: italic\">{{count}}<\u002Fdiv>\n<div style=\"font-weight: 800; letter-spacing: .14em; text-transform: uppercase\">Ignition sequence<\u002Fdiv>\n\n\n<div class=\"burst\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<div class=\"serif\" style=\"font-size: clamp(40px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em\">You're live.<\u002Fdiv>\n<div style=\"width: min(520px, 100%); border-radius: 16px; background: #fff; box-shadow: 0 20px 40px rgba(20,33,61,.12); overflow: hidden; text-align: left\">\n<div style=\"display: flex; gap: 6px; padding: 12px 14px; background: #EDE7DA\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #E9A69C\"><\u002Fspan><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #E8CF8A\"><\u002Fspan><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #A9C59A\"><\u002Fspan><\u002Fdiv>\n<div style=\"padding: 14px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 17px\">https://{{typed}}<span class=\"caret\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 15px\">Final score <strong style=\"font-size: 22px\">{{score}}<\u002Fstrong><\u002Fdiv>\n\n<div class=\"col-m\" style=\"display: flex; gap: 10px; width: min(520px, 100%)\">\n<label for=\"lbname\" style=\"position: absolute; left: -9999px\">Your name<\u002Flabel>\n<input id=\"lbname\" placeholder=\"Your name\" maxlength=\"24\" style=\"flex: 1; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #14213D; background: #fff; font: 600 16px 'Manrope', sans-serif; color: #14213D\">\n<button class=\"btn\" style=\"min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: #D4FF3A; font: 800 15px 'Manrope', sans-serif; color: #14213D\">Save to leaderboard<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"font-weight: 700\">Saved. Check the leaderboard below.<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: center\">\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid #14213D; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14213D\">Play again<\u002Fbutton>\n<button disabled=\"\" style=\"min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 0; background: rgba(20,33,61,.12); font: 700 14px 'Manrope', sans-serif; color: rgba(20,33,61,.55); cursor: not-allowed\">Next session · Coming soon<\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n\n\n<div style=\"margin-top: 24px; padding: 20px; border-radius: 22px; background: #14213D; color: #F6F1E7; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap\">\n<div><div style=\"font-weight: 800\">Level cleared. +25% fuel<\u002Fdiv><div style=\"font-size: 13px; opacity: .8; margin-top: 2px\">{{clearNote}}<\u002Fdiv><\u002Fdiv>\n<button class=\"btn\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 0; background: #D4FF3A; font: 800 15px 'Manrope', sans-serif; color: #14213D\">{{nextLevelLabel}}<\u002Fbutton>\n<\u002Fdiv>\n\n\n<div aria-live=\"polite\" style=\"margin-top: 16px; min-height: 24px; font-size: 15px; font-weight: 600; \">{{msg}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div class=\"col-m\" style=\"margin-top: 24px; border-radius: 28px; background: #14213D; color: #F6F1E7; padding: 28px; display: flex; justify-content: space-between; align-items: center; gap: 20px\">\n<div>\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #D4FF3A\">Session 01 result<\u002Fdiv>\n<div class=\"serif\" style=\"font-size: 32px; margin-top: 6px\">{{resultLine}}<\u002Fdiv>\n<\u002Fdiv>\n<button disabled=\"\" style=\"min-height: 52px; padding: 14px 24px; border-radius: 999px; border: 1px dashed rgba(246,241,231,.4); background: transparent; color: rgba(246,241,231,.7); font: 700 15px 'Manrope', sans-serif; cursor: not-allowed\">Next session · Coming soon<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"leaderboard\" style=\"padding: 120px 24px; background: #F6F1E7\">\n<div style=\"max-width: 1320px; margin: 0 auto\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #6F8A6B\">Progress &amp; leaderboard<\u002Fdiv>\n<h2 class=\"serif\" style=\"font-size: clamp(40px, 5.5vw, 80px); line-height: 1; letter-spacing: -0.03em; font-weight: 400; margin: 16px 0 0\">How far have you flown?<\u002Fh2>\n<div style=\"margin-top: 40px; border-radius: 28px; background: #fff; padding: 28px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700\"><span>Semester progress<\u002Fspan><span>{{semPct}}%<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top: 14px; height: 18px; border-radius: 9px; background: #EDE7DA; overflow: hidden; position: relative\">\n<div style=\"height: 100%; background: linear-gradient(90deg, #C9D8B6, #D4FF3A); transition: width .8s; \"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 12px; font-weight: 700; color: #3B4A6B\"><span>01 LaunchLab<\u002Fspan><span>02 · soon<\u002Fspan><span>03 · soon<\u002Fspan><span>04 · soon<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px\">\n<div style=\"border-radius: 28px; background: #C9D8B6; padding: 28px\">\n<div class=\"serif\" style=\"font-size: 30px\">Badges<\u002Fdiv>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px\">\n\n<div class=\"lift\" style=\"padding: 18px 14px; border-radius: 20px; text-align: center; \">\n<div style=\"width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; \">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l3 6 6 .9-4.5 4.4 1 6.2L12 16.6 6.5 19.5l1-6.2L3 8.9 9 8z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-weight: 800; font-size: 14px; margin-top: 10px\">{{b.t}}<\u002Fdiv>\n<div style=\"font-size: 12px; margin-top: 4px; opacity: .75\">{{b.d}}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 28px; background: #14213D; color: #F6F1E7; padding: 28px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\"><div class=\"serif\" style=\"font-size: 30px\">Leaderboard<\u002Fdiv><span style=\"font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 6px 10px; border-radius: 999px; border: 1px dashed rgba(246,241,231,.4)\">SUPABASE · NOT CONNECTED YET<\u002Fspan><\u002Fdiv>\n\n<div style=\"margin-top: 24px; padding: 28px; border-radius: 20px; border: 1px dashed rgba(246,241,231,.3); text-align: center; opacity: .85\">No scores yet. Finish the game to be the first.<\u002Fdiv>\n\n<ol style=\"list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 8px\">\n\n<li style=\"display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 16px; background: rgba(246,241,231,.08)\">\n<span class=\"serif\" style=\"font-size: 26px; font-style: italic; width: 32px\">{{r.rank}}<\u002Fspan>\n<span style=\"flex: 1; font-weight: 700\">{{r.name}}<\u002Fspan>\n<span style=\"font-weight: 800; color: #D4FF3A\">{{r.score}}<\u002Fspan>\n<\u002Fli>\n\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 140px 24px 100px; background: #C9D8B6; position: relative; overflow: hidden\" class=\"grain\">\n<div aria-hidden=\"true\" class=\"float\" style=\"position: absolute; right: -80px; bottom: -80px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #fff, #F3D3CF 40%, #B0655E 110%)\"><\u002Fdiv>\n<div style=\"max-width: 1000px; margin: 0 auto; position: relative\">\n<div style=\"font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase\">Epilogue<\u002Fdiv>\n<h2 class=\"serif\" style=\"font-size: clamp(48px, 7vw, 112px); line-height: .95; letter-spacing: -0.035em; font-weight: 400; margin: 18px 0 0\">What we'll take with us.<\u002Fh2>\n<p class=\"serif\" style=\"font-size: clamp(22px, 2.4vw, 30px); line-height: 1.45; margin: 32px 0 0\">The first speakers of the semester were younger than us, and they still ran the room. What stayed with us is less the tools than the habit behind them: describe clearly, build fast, put it out there. And say yes when a door opens, because one breakfast conversation is how this whole session happened.<\u002Fp>\n<p style=\"font-size: 14px; margin: 24px 0 0; color: #2E3E2E\">[This reflection grows with each new chapter.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #14213D; color: #F6F1E7; padding: 64px 24px 40px\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div class=\"serif\" style=\"font-size: clamp(28px, 4.2vw, 64px); line-height: 1.02; letter-spacing: -0.03em\">valentine lemasson b00840214 &amp; charlotte bucsila b00836753 website<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-size: 14px; opacity: .85\">\n<span>Valentine Lemasson · B00840214 &amp; Charlotte Bucsila · B00836753<\u002Fspan>\n<span>ESSEC Business School Singapore · MSc Marketing Management &amp; Digital · Fall 2026<\u002Fspan>\n<a href=\"#top\" style=\"color: #D4FF3A; font-weight: 700\">Back to top ↑<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#FF7A45&quot;,&quot;#7C6CFF&quot;,&quot;#3DDC97&quot;]},&quot;calm&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:9400}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = Object.assign({ mx: 0, my: 0, stage: 0, goodPrompt: false, flips: {}, takeN: 0, cnt: 0, board: [], played: 0, badges: {}, name: '' }, this.fresh());\n    this.T = {};\n  }\n  fresh() {\n    return { level: 0, score: 0, fuel: 0, fb: '', msg: '', l1: [], l1bad: [], l2: [], l3: [], l3sel: '', l4i: 0, l4t: 10, lock: false, bi: 0, clear: false, phase: 'play', count: 3, typed: '', saved: false };\n  }\n  D() {\n    if (this._d) return this._d;\n    this._d = {\n      GOOD: ['Role', 'Goal', 'Target audience', 'Pages needed', 'Design style', 'Output required'],\n      CHIPS: ['Role', 'Make it nice', 'Goal', 'Target audience', 'Use any colours', 'Pages needed', 'Design style', 'Output required'],\n      PIPE: ['Claude Design', 'Handoff to Claude Code', 'Push to GitHub', 'Import into Vercel', 'Live link'],\n      PIPE_SHUF: ['Push to GitHub', 'Live link', 'Claude Design', 'Import into Vercel', 'Handoff to Claude Code'],\n      TERMS: [\n        { term: 'Fork', m: \"Your own copy of someone else's repo\" },\n        { term: 'Clone', m: 'Download a repo onto your computer' },\n        { term: 'Commit', m: 'Save a snapshot of your changes locally' },\n        { term: 'Push', m: 'Send your commits up to GitHub' },\n        { term: 'Pull Request', m: 'Ask teammates to review your changes' },\n        { term: 'Merge', m: 'Combine approved changes into the main project' }\n      ],\n      MEAN_ORDER: [3, 0, 5, 1, 4, 2],\n      Q4: [\n        { q: 'Change the text on the main button', a: 'index.html' },\n        { q: 'Make that button orange', a: 'styles.css' },\n        { q: 'Make the button do something when clicked', a: 'script.js' },\n        { q: 'Add a new heading', a: 'index.html' },\n        { q: 'Change the font size on phones', a: 'styles.css' },\n        { q: 'Show a message when a form is submitted', a: 'script.js' }\n      ],\n      TF: [\n        { s: 'A commit saves your work on GitHub.', a: false, why: 'It stays on your computer until you push.' },\n        { s: 'Vercel stores your code.', a: false, why: 'GitHub stores it, Vercel hosts it.' },\n        { s: 'Every pull request on Vercel gets its own preview link.', a: true, why: 'Each PR gets a preview to check before merging.' },\n        { s: 'After logging in, you type your password on every click.', a: false, why: 'A token does that job.' },\n        { s: 'Without a database, a Wordle clone forgets you when you close the tab.', a: true, why: 'Nothing is stored, so nothing is remembered.' },\n        { s: 'Supabase can add sign-ups and a user database to your site.', a: true, why: 'That is exactly what a backend-as-a-service does.' },\n        { s: 'Claude Code can only autocomplete code, not run commands.', a: false, why: 'It reads your project, runs commands and fixes its own errors.' }\n      ],\n      STAGES: [\n        { n: '01', part: 'Design & Build', t: 'Design', tool: 'Claude Design' },\n        { n: '02', part: 'Design & Build', t: 'Handoff', tool: 'Share menu' },\n        { n: '03', part: 'Design & Build', t: 'Build', tool: 'Claude Code' },\n        { n: '04', part: 'Store & Ship', t: 'Store', tool: 'GitHub' },\n        { n: '05', part: 'Store & Ship', t: 'Ship', tool: 'Vercel' },\n        { n: '06', part: 'Remember', t: 'The limits', tool: 'Basic sites' },\n        { n: '07', part: 'Remember', t: 'Logging in', tool: 'Tokens' },\n        { n: '08', part: 'Remember', t: 'Supabase', tool: 'Backend' }\n      ],\n      FLIPS: [\n        { k: 'r', t: 'Routines', d: 'Repeated background tasks, like \"check this folder for errors every hour\".' },\n        { k: 'f', t: 'Refactoring', d: 'Clean up or reorganize code without changing what it does.' },\n        { k: 'c', t: 'Session context', d: 'It remembers what commands ran, what broke and what you were trying to fix.' }\n      ],\n      TAKE: [\n        'A detailed prompt beats a vague one every time',\n        'Design first, then hand off to Claude Code to build',\n        'GitHub stores your code, Vercel turns it into a live website',\n        'Push when you work solo, open a pull request when you work as a team',\n        'A real site needs a database to remember users and data',\n        'Say yes to opportunities: this whole session started with one conversation'\n      ],\n      STORY: \"Rishabh used to not see the point of networking. At a Junior Achievement Asia Pacific workshop, he started a conversation at a networking breakfast with Professor Madina Kalyayeva, told her about his team's vibe coding work, and she offered them an hour with her students.\"\n    };\n    return this._d;\n  }\n  componentDidMount() {\n    this.T.cnt = setInterval(() => {\n      const c = Math.min(1, this.state.cnt + 0.04);\n      this.setState({ cnt: c });\n      if (c >= 1) clearInterval(this.T.cnt);\n    }, 40);\n  }\n  componentWillUnmount() {\n    Object.keys(this.T).forEach((k) => { clearInterval(this.T[k]); clearTimeout(this.T[k]); });\n  }\n  fire(ok, msg) {\n    this.setState({ fb: ok ? 'ok' : 'bad', msg: msg || '' });\n    clearTimeout(this.T.fb);\n    this.T.fb = setTimeout(() => this.setState({ fb: '' }), 750);\n  }\n  clearLevel() {\n    this.setState((s) => {\n      const b = Object.assign({}, s.badges); b['b' + s.level] = true;\n      return { clear: true, fuel: Math.max(s.fuel, s.level), badges: b };\n    });\n  }\n  startTimer() {\n    clearInterval(this.T.l4);\n    this.T.l4 = setInterval(() => {\n      if (this.state.lock || this.state.level !== 4) return;\n      const t = this.state.l4t - 1;\n      if (t <= 0) { this.setState({ l4t: 0 }); this.answer4(null); }\n      else this.setState({ l4t: t });\n    }, 1000);\n  }\n  pickChip(c) {\n    const s = this.state, D = this.D();\n    if (s.level !== 1 || s.clear || s.l1.includes(c) || s.l1bad.includes(c)) return;\n    if (D.GOOD.includes(c)) {\n      const l1 = s.l1.concat([c]);\n      this.setState({ l1, score: s.score + 10 });\n      this.fire(true, c + ' added to the prompt.');\n      if (l1.length === 6) this.clearLevel();\n    } else {\n      this.setState({ l1bad: s.l1bad.concat([c]) });\n      this.fire(false, '\"' + c + '\" is too vague to help the model. The good ones are: ' + D.GOOD.filter((g) => !s.l1.includes(g)).join(', ') + '.');\n    }\n  }\n  pickPipe(it) {\n    const s = this.state, D = this.D();\n    if (s.level !== 2 || s.clear || s.l2.includes(it)) return;\n    const i = s.l2.length;\n    if (it === D.PIPE[i]) {\n      const l2 = s.l2.concat([it]);\n      this.setState({ l2, score: s.score + 10 });\n      this.fire(true, 'Step ' + (i + 1) + ': ' + it + '.');\n      if (l2.length === 5) this.clearLevel();\n    } else {\n      this.fire(false, 'Not yet. Step ' + (i + 1) + ' is \"' + D.PIPE[i] + '\".');\n    }\n  }\n  matchMeaning(term, mObj) {\n    const s = this.state, D = this.D();\n    if (s.level !== 3 || s.clear || s.l3.includes(mObj.term)) return;\n    if (!term) { this.fire(false, 'Pick a term first, then its meaning.'); return; }\n    if (term === mObj.term) {\n      const l3 = s.l3.concat([term]);\n      this.setState({ l3, l3sel: '', score: s.score + 10 });\n      this.fire(true, term + ': matched.');\n      if (l3.length === 6) this.clearLevel();\n    } else {\n      const right = D.TERMS.find((x) => x.term === term);\n      this.setState({ l3sel: '' });\n      this.fire(false, 'Not quite. ' + term + ' means: ' + right.m.toLowerCase() + '.');\n    }\n  }\n  answer4(f) {\n    const s = this.state, D = this.D();\n    if (s.lock || s.level !== 4 || s.clear) return;\n    const q = D.Q4[s.l4i];\n    const ok = f === q.a;\n    this.setState({ lock: true, score: s.score + (ok ? 5 + s.l4t : 0) });\n    this.fire(ok, ok ? 'Right: ' + q.a + '.' : (f ? 'It’s ' + q.a + '.' : 'Time’s up. It’s ' + q.a + '.'));\n    clearTimeout(this.T.n4);\n    this.T.n4 = setTimeout(() => {\n      const n = this.state.l4i + 1;\n      if (n >= D.Q4.length) { clearInterval(this.T.l4); this.setState({ lock: false }); this.clearLevel(); }\n      else this.setState({ l4i: n, l4t: 10, lock: false });\n    }, 1100);\n  }\n  answerTF(v) {\n    const s = this.state, D = this.D();\n    if (s.lock || s.level !== 5) return;\n    const q = D.TF[s.bi];\n    const ok = v === q.a;\n    this.setState({ lock: true, score: s.score + (ok ? 10 : 0) });\n    this.fire(ok, (ok ? 'Correct. ' : (q.a ? 'Actually true. ' : 'False. ')) + q.why);\n    clearTimeout(this.T.nb);\n    this.T.nb = setTimeout(() => {\n      const n = this.state.bi + 1;\n      if (n >= D.TF.length) { this.setState({ lock: false }); this.launch(); }\n      else this.setState({ bi: n, lock: false });\n    }, 1500);\n  }\n  launch() {\n    clearTimeout(this.T.nb);\n    this.setState((s) => {\n      const b = Object.assign({}, s.badges); b.b5 = true;\n      return { level: 6, clear: false, phase: 'count', count: 3, typed: '', msg: '', lock: false, played: s.played + 1, badges: b, fuel: 4 };\n    });\n    clearInterval(this.T.cd);\n    this.T.cd = setInterval(() => {\n      const c = this.state.count - 1;\n      if (c <= 0) {\n        clearInterval(this.T.cd);\n        this.setState({ count: 0, phase: 'live' });\n        const url = 'your-site.vercel.app';\n        clearInterval(this.T.ty);\n        this.T.ty = setInterval(() => {\n          const t = this.state.typed;\n          if (t.length >= url.length) { clearInterval(this.T.ty); return; }\n          this.setState({ typed: url.slice(0, t.length + 1) });\n        }, 70);\n      } else this.setState({ count: c });\n    }, 850);\n  }\n  renderVals() {\n    const s = this.state, D = this.D();\n    const accent = this.props.accent ?? '#D4FF3A';\n    const calm = this.props.calm ?? false;\n    const stage = s.stage;\n    const cur = D.STAGES[stage];\n    const stages = D.STAGES.map((st, i) => ({\n      n: st.n, t: st.t, tool: st.tool, part: st.part,\n      partStart: i === 0 || D.STAGES[i - 1].part !== st.part,\n      cls: i === stage ? 'on' : (i < stage ? 'done' : ''),\n      go: () => this.setState({ stage: i })\n    }));\n    const pct = Math.round((stage / 7) * 100);\n    const partBg = cur.part === 'Design & Build' ? '#F3D3CF' : (cur.part === 'Store & Ship' ? '#C9D8B6' : accent);\n    const words = D.STORY.split(' ').map((t, i) => ({ t, st: 'animation-delay: ' + (i * 45) + 'ms' }));\n    const speakers = [\n      { name: 'Rishabh Modi', ini: 'RM', bg: '#F3D3CF', photo: '/_blob/e99077b76e3912fbee379ab3bfef6327', role: 'Senior (Grade 12) at Singapore American School, into business, entrepreneurship and engineering',\n        chips: ['CEO of EcoBean: 3rd at the Junior Achievement Entrepreneurship Competition, the first SAS team in the top three in six years', 'Founder and President of Project Wish, a club supporting Ambulance Wish Singapore', 'Co-President of CFA Club, officer of the Entrepreneurship Club'],\n        hasLine: true, line: 'The networking story that got them into ESSEC is his.', li: 'https://www.linkedin.com/in/rishabh-modi-2b0b06307/' },\n      { name: 'Yibo Yang', ini: 'YY', bg: '#C9D8B6', photo: '/_blob/2eea6c3d144e4f526085bd435729a5fb', role: 'Sophomore at Singapore American School, into machine learning and AI education',\n        chips: ['Founder of OpenSkills, an applied AI education non-profit for migrant workers and students', 'Ran a five-Sunday program with ItsRainingRaincoats: 15+ migrant workers built their own websites', 'Over 5.6k SGD raised for causes'],\n        hasLine: true, line: '\"Keep building.\"', li: 'https://www.linkedin.com/in/yiboyang8/' },\n      { name: 'Nirvan Anand', ini: 'NA', bg: '#E4E0F2', photo: '/_blob/9cc7252165f38ad694d33fddaf1332b7', role: 'Student at Singapore American School and co-presenter of the session',\n        chips: ['Co-built the LaunchLab presentation', 'Recently earned the Investment Foundations Certificate from the CFA Institute'],\n        hasLine: false, line: '', li: 'https://www.linkedin.com/in/nirvan-anand-597133407/' }\n    ];\n    const flips = D.FLIPS.map((f) => ({ t: f.t, d: f.d, on: !!s.flips[f.k], cls: s.flips[f.k] ? 'on' : '',\n      go: () => this.setState((st) => { const o = Object.assign({}, st.flips); o[f.k] = !o[f.k]; return { flips: o }; }) }));\n    const takeaways = D.TAKE.map((t, i) => ({ n: '0' + (i + 1), t, cls: i < s.takeN ? '' : 'hid', bg: ['#fff', '#C9D8B6', '#F3D3CF'][i % 3] }));\n    const goodParts = [\n      { k: 'Role', v: 'You are a creative web designer.' },\n      { k: 'Goal', v: 'A site that helps classmates revise our guest sessions.' },\n      { k: 'Target audience', v: \"Marketing master's students and our professor.\" },\n      { k: 'Pages needed', v: 'Home, one tab per session, a leaderboard.' },\n      { k: 'Design style', v: 'Editorial, cream and navy, bold motion.' },\n      { k: 'Key features', v: 'A short game per session and a progress bar.' },\n      { k: 'Output required', v: 'A polished, responsive design ready to hand off.' }\n    ];\n    const tabOn = 'background: #14213D; color: #F6F1E7';\n    const tabOff = 'background: transparent; color: #14213D';\n    // game\n    const allowDrop = (e) => e.preventDefault();\n    const l1Chips = D.CHIPS.map((c) => {\n      const used = s.l1.includes(c) || s.l1bad.includes(c);\n      return { t: c, used, cls: used ? 'used' : '', go: () => this.pickChip(c),\n        drag: (e) => { this.dragItem = c; try { e.dataTransfer.setData('text/plain', c); } catch (err) {} } };\n    });\n    const l2Items = D.PIPE_SHUF.map((c) => {\n      const used = s.l2.includes(c);\n      return { t: c, used, cls: used ? 'used' : '', go: () => this.pickPipe(c),\n        drag: (e) => { this.dragItem = c; try { e.dataTransfer.setData('text/plain', c); } catch (err) {} } };\n    });\n    const l2Slots = D.PIPE.map((p, i) => ({ n: i + 1, t: s.l2[i] || '…',\n      st: s.l2[i] ? 'background: #C9D8B6' : (i === s.l2.length ? 'background: #fff; border: 2px dashed #14213D' : 'background: rgba(255,255,255,.5); border: 2px dashed rgba(20,33,61,.18)') }));\n    const l3Terms = D.TERMS.map((x) => {\n      const used = s.l3.includes(x.term);\n      return { t: x.term, used, cls: used ? 'used' : (s.l3sel === x.term ? 'sel' : ''),\n        go: () => this.setState({ l3sel: s.l3sel === x.term ? '' : x.term }),\n        drag: (e) => { this.dragItem = x.term; this.setState({ l3sel: x.term }); try { e.dataTransfer.setData('text/plain', x.term); } catch (err) {} } };\n    });\n    const l3Means = D.MEAN_ORDER.map((i) => {\n      const x = D.TERMS[i];\n      const used = s.l3.includes(x.term);\n      return { label: used ? x.term + ' · ' + x.m : x.m, used,\n        st: used ? 'background: #C9D8B6; border-style: solid; cursor: default' : 'background: #fff',\n        go: () => this.matchMeaning(s.l3sel, x),\n        drop: (e) => { e.preventDefault(); this.matchMeaning(this.dragItem, x); } };\n    });\n    const lv = s.level;\n    const q4 = D.Q4[Math.min(s.l4i, D.Q4.length - 1)].q;\n    const tf = D.TF[Math.min(s.bi, D.TF.length - 1)].s;\n    const fuelPct = s.fuel * 25;\n    const badgeDefs = [\n      { k: 'b1', t: 'Prompt pro', d: 'Level 1' }, { k: 'b2', t: 'Pipeline builder', d: 'Level 2' },\n      { k: 'b3', t: 'Git fluent', d: 'Level 3' }, { k: 'b4', t: 'File whisperer', d: 'Level 4' },\n      { k: 'b5', t: 'Liftoff', d: 'Session 1 done' }\n    ];\n    const badges = badgeDefs.map((b) => {\n      const on = !!s.badges[b.k];\n      return { t: b.t, d: on ? b.d : 'Locked · ' + b.d,\n        st: on ? 'background: #F6F1E7' : 'background: rgba(246,241,231,.35); color: rgba(20,33,61,.55)',\n        disc: on ? 'background: ' + accent + '; color: #14213D' : 'background: rgba(20,33,61,.08); color: rgba(20,33,61,.4)' };\n    });\n    const semPct = Math.round((s.fuel / 4) * 25);\n    const board = s.board.map((r, i) => ({ rank: i + 1, name: r.name, score: r.score }));\n    const clearNotes = { 1: 'Your prompt now has a role, a goal and a real brief.', 2: 'Idea to live link, in the right order.', 3: 'Six Git words, all yours.', 4: 'You know which file to open.' };\n    const resultLine = lv === 6 ? 'Launched with ' + s.score + ' points. Fuel 100%.' : (lv === 0 ? 'Not played yet. Fuel 0%.' : 'In progress: ' + s.score + ' points, fuel ' + fuelPct + '%.');\n    const sx = (s.mx * 36).toFixed(1), sy = (s.my * 36).toFixed(1);\n    return {\n      accent, rootCls: calm ? 'calm' : '',\n      sphereStyle: 'transition: transform .3s ease-out; transform: translate3d(' + sx + 'px, ' + sy + 'px, 0) rotateX(' + (-s.my * 18).toFixed(1) + 'deg) rotateY(' + (s.mx * 18).toFixed(1) + 'deg)',\n      onHero: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        this.setState({ mx: (e.clientX - r.left) / r.width - 0.5, my: (e.clientY - r.top) / r.height - 0.5 });\n      },\n      cSessions: Math.round(1 * s.cnt), cTakeaways: Math.round(6 * s.cnt), played: s.played,\n      locked: [{ n: '02' }, { n: '03' }, { n: '04' }],\n      storyText: D.STORY, storyWords: words, speakers,\n      stages, cur, partBg,\n      rocketStyle: 'bottom: calc(24px + (100% - 48px) * ' + (stage / 7).toFixed(3) + ')',\n      trailStyle: 'height: calc((100% - 48px) * ' + (stage / 7).toFixed(3) + ')',\n      s0: stage === 0, s1: stage === 1, s2: stage === 2, s3: stage === 3, s4: stage === 4, s5: stage === 5, s6: stage === 6, s7: stage === 7,\n      prevStage: () => this.setState({ stage: Math.max(0, stage - 1) }),\n      nextStage: () => { if (stage < 7) this.setState({ stage: stage + 1 }); else { const el = document.getElementById('game'); if (el) el.scrollIntoView({ behavior: 'smooth' }); } },\n      nextLabel: stage < 7 ? 'Next stage →' : 'Play the game →',\n      goodPrompt: s.goodPrompt, badShown: !s.goodPrompt, goodParts,\n      badPressed: s.goodPrompt ? 'false' : 'true', goodPressed: s.goodPrompt ? 'true' : 'false',\n      badTabStyle: s.goodPrompt ? tabOff : tabOn, goodTabStyle: s.goodPrompt ? tabOn : tabOff,\n      showBad: () => this.setState({ goodPrompt: false }), showGood: () => this.setState({ goodPrompt: true }),\n      flips,\n      takeaways, takeN: s.takeN,\n      revealNext: () => this.setState({ takeN: Math.min(6, s.takeN + 1) }),\n      revealAll: () => this.setState({ takeN: 6 }),\n      // game\n      score: s.score, levelLabel: lv === 0 ? '–' : (lv === 5 ? 'Bonus' : (lv === 6 ? 'Live' : lv + '/4')),\n      fuelPct, fuelStyle: 'height: ' + fuelPct + '%',\n      rocketCls: s.phase === 'live' ? 'launch' : 'float',\n      panelCls: s.fb === 'bad' ? 'shake' : '', fbOk: s.fb === 'ok',\n      msg: s.msg, msgStyle: s.fb === 'bad' ? 'color: #9B2C2C' : 'color: #14213D',\n      g0: lv === 0, g1: lv === 1, g2: lv === 2, g3: lv === 3, g4: lv === 4, g5: lv === 5, g6: lv === 6,\n      startGame: () => this.setState({ level: 1, msg: '' }),\n      allowDrop,\n      l1Chips, l1Placed: s.l1, l1Empty: s.l1.length === 0,\n      dropL1: (e) => { e.preventDefault(); if (this.dragItem) this.pickChip(this.dragItem); },\n      l2Items, l2Slots,\n      dropL2: (e) => { e.preventDefault(); if (this.dragItem) this.pickPipe(this.dragItem); },\n      l3Terms, l3Means,\n      q4, q4Num: s.l4i + 1, l4t: s.l4t, timerStyle: 'width: ' + (s.l4t * 10) + '%',\n      pickHtml: () => this.answer4('index.html'), pickCss: () => this.answer4('styles.css'), pickJs: () => this.answer4('script.js'),\n      tf, tfNum: s.bi + 1,\n      pickTrue: () => this.answerTF(true), pickFalse: () => this.answerTF(false),\n      doLaunch: () => this.launch(),\n      clear: s.clear && lv >= 1 && lv <= 4, clearNote: clearNotes[lv] || '',\n      nextLevelLabel: lv < 4 ? 'Level ' + (lv + 1) + ' →' : 'Bonus round →',\n      nextLevel: () => {\n        const n = lv + 1;\n        this.setState({ level: n, clear: false, msg: '', l4i: 0, l4t: 10, lock: false, bi: 0 });\n        if (n === 4) this.startTimer();\n      },\n      counting: s.phase === 'count', launched: s.phase === 'live', count: s.count, typed: s.typed,\n      name: s.name, setName: (e) => this.setState({ name: e.target.value }),\n      notSaved: !s.saved, saved: s.saved,\n      save: () => {\n        const nm = (s.name || '').trim();\n        if (!nm) { this.fire(false, 'Add a name first.'); return; }\n        const b = s.board.concat([{ name: nm, score: s.score }]).sort((a, c) => c.score - a.score).slice(0, 10);\n        this.setState({ board: b, saved: true, msg: '' });\n      },\n      replay: () => { Object.keys(this.T).forEach((k) => { clearInterval(this.T[k]); clearTimeout(this.T[k]); }); this.setState(Object.assign(this.fresh(), { level: 1 })); },\n      resultLine,\n      badges, semPct, semStyle: 'width: ' + semPct + '%',\n      board, boardEmpty: board.length === 0\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
